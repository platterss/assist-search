<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIST Search</title>
    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add("dark-mode");
            }
        })();
    </script>
</head>
<body class="no-transition">
<div class="container">
    <header>
        <h1>ASSIST Search</h1>
        <p class="subtitle">Search for all CCC articulations for a university course.</p>
        <br>

        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="sun-icon">☀️</span>
                <span class="moon-icon">🌙</span>
            </button>
            <a class="github-btn" href="https://github.com/platterss/assist-search" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub repository">
              <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 16 16">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                         0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                         -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                         .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                         -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
                         1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
                         1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
                         1.93-.01 2.2 0 .21.15.46.55.38C13.71 14.53 16 11.54 16 8A8 8 0 0 0 8 0z"/>
              </svg>
            </a>
        </div>
    </header>

    <main>
        <div class="search-section">
            <div class="form-group">
                <label for="university-search" class="form-label">University</label>
                <div class="select-wrapper custom-select-wrapper">
                    <input type="text" id="university-search" class="form-control" placeholder="Select a university..." autocomplete="off" spellcheck="false" autocapitalize="off">
                    <button class="dropdown-action-btn" tabindex="-1" type="button" aria-label="Toggle or Clear">
                        <svg class="icon-clear" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        <svg class="icon-caret" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="university-dropdown" class="custom-options-list"></div>
                    <span class="loading-spinner" id="university-loader" style="display: none;"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="view-by-search" class="form-label">View By</label>
                <div class="select-wrapper custom-select-wrapper">
                    <input type="text" id="view-by-search" class="form-control" value="Subject" readonly autocomplete="off" spellcheck="false" autocapitalize="off">
                    <button class="dropdown-action-btn" tabindex="-1" type="button" aria-label="Toggle or Clear">
                        <svg class="icon-clear" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        <svg class="icon-caret" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="view-by-dropdown" class="custom-options-list"></div>
                </div>
            </div>

            <div class="form-group">
                <label id="category-label" for="category-search" class="form-label">Subject</label>
                <div class="select-wrapper custom-select-wrapper">
                    <input type="text" id="category-search" class="form-control" placeholder="Select a subject..." disabled autocomplete="off" spellcheck="false" autocapitalize="off">
                    <button class="dropdown-action-btn" tabindex="-1" type="button" aria-label="Toggle or Clear">
                        <svg class="icon-clear" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        <svg class="icon-caret" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="category-dropdown" class="custom-options-list"></div>
                    <span class="loading-spinner" id="category-loader" style="display: none;"></span>
                </div>
            </div>

            <div class="form-group">
                <label id="item-label" for="item-search" class="form-label">Course</label>
                <div class="select-wrapper custom-select-wrapper">
                    <input type="text" id="item-search" class="form-control" placeholder="Select a course..." disabled autocomplete="off" spellcheck="false" autocapitalize="off">
                    <button class="dropdown-action-btn" tabindex="-1" type="button" aria-label="Toggle or Clear">
                        <svg class="icon-clear" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        <svg class="icon-caret" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div id="item-dropdown" class="custom-options-list"></div>
                    <span class="loading-spinner" id="item-loader" style="display: none;"></span>
                </div>
            </div>
        </div>

        <div id="articulation-results" class="articulation-results" style="display: none;">
            <div class="results-header">
                <h2>Articulation Results</h2>
                <p class="selected-course" id="selected-course-display"></p>
            </div>

            <div id="articulation-loading" class="articulation-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p>Loading articulations...</p>
            </div>

            <div id="articulation-cards" class="articulation-cards"></div>

            <div id="no-articulations" class="no-articulations" style="display: none;">
                <p>No articulations found for the selected course.<br>It will have to be taken at the university.</p>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
